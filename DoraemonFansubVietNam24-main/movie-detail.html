        const LOGO_URL = 'https://i.ibb.co/9kJhtfp1/Doraemon-fansub.png';

        function getOptimizedAvatarUrl(url, size = 150) {
            if (!url) return LOGO_URL;
            if (typeof url === 'string' && url.includes('res.cloudinary.com') && url.includes('/upload/')) {
                if (url.includes('/upload/w_') || url.includes('/upload/c_fill')) {
                    return url;
                }
                return url.replace('/upload/', `/upload/w_${size},h_${size},c_fill,g_face,q_auto,f_auto/`);
            }
            return url;
        }

        function getTimestampValue(ts) {
            if (!ts) return 0;
            if (typeof ts === 'number') return ts;
            if (ts && typeof ts.toDate === 'function') return ts.toDate().getTime();
            if (ts && typeof ts.seconds === 'number') return ts.seconds * 1000;
            if (ts instanceof Date) return ts.getTime();
            if (typeof ts === 'string') {
                const parsedNum = Number(ts);
                if (!isNaN(parsedNum) && parsedNum > 1000000000) return parsedNum;
                const d = new Date(ts);
                return isNaN(d.getTime()) ? 0 : d.getTime();
            }
            return 0;
        }

        function timeAgo(timestamp) {
            const tsVal = getTimestampValue(timestamp);
            if (!tsVal) return 'Vừa xong';

            const now = Date.now();
            const diff = Math.floor((now - tsVal) / 1000);

            if (diff < 10) return 'Vừa xong';
            if (diff < 60) return `${Math.max(10, diff)} giây trước`;
            if (diff < 3600) return `${Math.floor(diff / 60)} phút trước`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} giờ trước`;
            if (diff < 86400 * 30) return `${Math.floor(diff / 86400)} ngày trước`;
            if (diff < 86400 * 365) return `${Math.floor(diff / (86400 * 30))} tháng trước`;
            return `${Math.floor(diff / (86400 * 365))} năm trước`;
        }

        function updateLiveTimes() {
            document.querySelectorAll('[data-timestamp]').forEach(el => {
                const raw = el.getAttribute('data-timestamp');
                if (raw && raw !== '0') {
                    const num = Number(raw);
                    const ts = !isNaN(num) ? num : raw;
                    const updated = timeAgo(ts);
                    if (updated && el.textContent !== updated) {
                        el.textContent = updated;
                    }
                }
            });
        }
        setInterval(updateLiveTimes, 10000);
        const REACTION_OPTIONS = [
            { id: 'happy', label: 'Vui', image: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#FDD835"/><circle cx="24" cy="27" r="3" fill="#2C2C2C"/><circle cx="40" cy="27" r="3" fill="#2C2C2C"/><path d="M22 42c3 4 17 4 20 0" stroke="#2C2C2C" stroke-width="3" fill="none" stroke-linecap="round"/></svg>') },
            { id: 'love', label: 'Yêu', image: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 55s-18-10.4-18-24a12 12 0 0 1 20-8 12 12 0 0 1 20 8c0 13.6-18 24-18 24Z" fill="#F06292"/></svg>') },

            { id: 'sad', label: 'Buồn', image: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#8BC34A"/><circle cx="24" cy="27" r="3" fill="#2C2C2C"/><circle cx="40" cy="27" r="3" fill="#2C2C2C"/><path d="M22 44c3-4 17-4 20 0" stroke="#2C2C2C" stroke-width="3" fill="none" stroke-linecap="round"/></svg>') },
            { id: 'fire', label: 'Hot', image: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 8c8 10 14 17 14 27a14 14 0 1 1-28 0c0-10 6-17 14-27Z" fill="#FF6F00"/><path d="M25 29c3 4 4 8 4 13h6c0-6-2-11-8-16Z" fill="#FFD54F"/></svg>') }
        ];
        let currentMovie = null;
        let movieId = null;
        let isLoggedIn = false;
        let isBanned = false;
        let authReady = false;
        let authStatePromise = null;
        let selectedCommentReaction = '';

        function getMovieIdFromURL() {
            const params = new URLSearchParams(window.location.search);

        async function checkBannedUser(email) {
            if (!email) return false;
            try {
                const doc = await db.collection('banned_users').doc(email).get();
                return doc.exists;

                console.error('Lỗi kiểm tra banned:', e);

        }

        const TWO_FACTOR_SESSION_KEY = 'twoFactorVerifiedUid';

        function getTwoFactorVerifiedUid() {
            return localStorage.getItem(TWO_FACTOR_SESSION_KEY);
        }

        async function getUserTwoFactorData(uid) {
            if (!uid) return null;
            try {
                const doc = await db.collection('users').doc(uid).get();
                return doc.exists ? doc.data()?.twoFactor || null : null;
            } catch (e) {
                console.error('Lỗi kiểm tra 2FA:', e);
                return null;
            }
        }

        // Lấy shortId của user từ Firestore
        async function getShortId(uid) {
            if (!uid) return null;
            try {
                const doc = await db.collection('users').doc(uid).get();
                return doc.data()?.shortId || null;
            } catch (e) {
                return null;
            }
        }

        function waitForAuthUser() {
            if (auth.currentUser) {
                authReady = true;
                return Promise.resolve(auth.currentUser);
            }

            if (authReady) {
                return Promise.resolve(null);
            }

            if (!authStatePromise) {
                authStatePromise = new Promise((resolve) => {
                    const unsubscribe = auth.onAuthStateChanged((user) => {
                        authReady = true;
                        unsubscribe();
                        resolve(user);
                    });
                });
            }

            return authStatePromise;
        }

        async function loadMovieDetail() {
            movieId = getMovieIdFromURL();
            const container = document.getElementById('movieContent');

            container.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p style="color: #999; font-size: 16px;">Đang tải phim, vui lòng chờ...</p>
                    </div>
                `;

            if (!movieId) {
                container.innerHTML = `
                        <div class="error-state">

                            <h2>Không tìm thấy phim</h2>
                            <p>ID phim không hợp lệ hoặc không tồn tại.</p>
                            <a href="index.html" class="btn-home">🏠 Về trang chủ</a>
                        </div>
                    `;
                return;
            }

            try {
                const doc = await db.collection('movies').doc(movieId).get();

                if (!doc.exists) {
                    container.innerHTML = `
                            <div class="error-state">

                                <h2>Phim không tồn tại</h2>
                                <p>Phim bạn tìm kiếm đã bị xóa hoặc không có.</p>

                        `;

                currentMovie = doc.data();

                try {
                    await db.collection('movies').doc(movieId).update({
                        views: (currentMovie.views || 0) + 1

                    console.warn('Không cập nhật được lượt xem:', e);
                }

                renderMovieDetail(currentMovie);

            } catch (e) {

                            <p>${e.message || 'Không thể tải phim. Vui lòng thử lại sau.'}</p>
                            <a href="index.html" class="btn-home">🏠 Về trang chủ</a>
                        </div>
                    `;
            }
        }

        function renderMovieDetail(movie) {
            const container = document.getElementById('movieContent');

            let videoContent = '';
            if (movie.embed) {
                videoContent = movie.embed;
            } else if (movie.video) {
                videoContent = `
                        <video controls autoplay>
                            <source src="${movie.video}">
                            Trình duyệt không hỗ trợ video
                        </video>
                    `;
            } else {
                videoContent = `<p style="color:#999;text-align:center;padding:40px;">Không có video</p>`;
            }

            document.title = `${movie.title || 'Xem phim'} - Doraemon Fansub`;

            const metaTitle = document.querySelector('meta[property="og:title"]');
            const metaDesc = document.querySelector('meta[property="og:description"]');
            if (metaTitle) metaTitle.content = `${movie.title || 'Xem phim'} - Doraemon Fansub`;
            if (metaDesc) metaDesc.content = movie.desc || 'Xem phim Doraemon và nhiều bộ phim hay khác';

            const episodeLabel = movie.episode || movie.title || 'Tập phim';
            container.innerHTML = `
                    <div class="movie-player">
                        <div class="video-wrapper">
                            ${videoContent}
                        </div>
                        <div class="movie-info">
                            <h1>${movie.title || 'Không có tiêu đề'}</h1>

                                <span class="genre">${movie.genre || 'Phim'}</span>
                                <span class="views">👁️ ${(movie.views || 0) + 1} lượt xem</span>
                                <span class="year">📅 ${movie.year || 'N/A'}</span>
                            </div>
                            <p class="desc">${movie.desc || ''}</p>
                        </div>

                        <section class="comment-section">
                            <h3>💬 Bình luận</h3>
                            <form id="commentForm" class="comment-form" onsubmit="submitComment(event)">
                                <textarea id="commentInput" placeholder="Viết bình luận của bạn..."></textarea>
                                <div id="imagePreviewContainer" class="image-preview-container"></div>
                                <div class="reaction-picker">
                                    ${REACTION_OPTIONS.map(option => `
                                        <button type="button" class="reaction-btn ${selectedCommentReaction === option.id ? 'active' : ''}" onclick="selectCommentReaction('${option.id}')" title="${option.label}">
                                            <img src="${option.image}" alt="${option.label}">
                                        </button>
                                    `).join('')}
                                </div>
                                <div class="comment-form-actions">
                                    <label class="file-upload-label">
                                        📷 Thêm ảnh
                                        <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(event)">
                                    </label>
                                    <button type="submit" class="comment-submit">Đăng</button>
                                </div>

        let selectedImages = [];
        let replyingToCommentId = '';
        let expandedReplies = new Set();

        function handleImageSelect(event) {
            const files = Array.from(event.target.files);
            const container = document.getElementById('imagePreviewContainer');

            files.forEach((file) => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const data = {
                            data: e.target.result,
                            name: file.name,
                            type: file.type
                        };
                        selectedImages.push(data);

                        const preview = document.createElement('div');
                        preview.className = 'image-preview';
                        preview.innerHTML = `
                            <img src="${data.data}" alt="preview">
                            <button type="button" class="image-preview-remove" onclick="removeImage(${selectedImages.length - 1})">✕</button>
                        `;
                        container.appendChild(preview);
                    };
                    reader.readAsDataURL(file);
                }
            });
            event.target.value = '';
        }

        function removeImage(index) {
            selectedImages.splice(index, 1);
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = selectedImages.map((img, i) => `
                <div class="image-preview">
                    <img src="${img.data}" alt="preview">
                    <button type="button" class="image-preview-remove" onclick="removeImage(${i})">✕</button>
                </div>
            `).join('');
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function selectCommentReaction(reactionId) {
            selectedCommentReaction = selectedCommentReaction === reactionId ? '' : reactionId;
            const buttons = document.querySelectorAll('.reaction-btn');
            buttons.forEach((btn) => {
                btn.classList.toggle('active', btn.getAttribute('onclick')?.includes(`'${reactionId}'`) && selectedCommentReaction === reactionId);
            });

        async function loadComments(movie) {
            const commentList = document.getElementById('commentsList');
            if (!commentList) return;

            commentList.innerHTML = '<div class="comment-empty">Đang tải bình luận...</div>';

            try {
                const snapshot = await db.collection('movie_comments')
                    .where('movieId', '==', movieId)
                    .get();

                const comments = snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => {
                        const timeA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
                        const timeB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
                        return timeB - timeA;
                    });

                if (!comments.length) {
                    commentList.innerHTML = '<div class="comment-empty">Chưa có bình luận nào. Hãy là người đầu tiên! 🎉</div>';
                    return;
                }

                commentList.innerHTML = comments.map((comment) => {
                    const timeText = timeAgo(comment.createdAt);
                    const displayId = comment.shortId
                        ? '#' + comment.shortId
                        : escapeHtml(comment.displayName || 'Người dùng');
                    const userName = displayId;
                    const userText = escapeHtml(comment.text || '');
                    const isOwner = auth.currentUser?.uid === comment.userId;
                    const avatarContent = comment.photoURL
                        ? `<img src="${escapeHtml(comment.photoURL)}" alt="${displayId}">`
                        : `<span>${(comment.shortId ? comment.shortId.charAt(0) : (comment.displayName || 'U').charAt(0)).toUpperCase()}</span>`;

                    const imagesMarkup = comment.images && comment.images.length > 0
                        ? `<div class="comment-image-container">${comment.images.map(img => 
                            `<img src="${img.data}" alt="attachment" class="comment-image" onclick="openImageViewer('${img.data}')">`
                          ).join('')}</div>`
                        : '';

                    const emotionCounts = comment.emotions || {};
                    const hasEmotions = Object.keys(emotionCounts).length > 0;
                    const emotionsMarkup = hasEmotions
                        ? `<div class="comment-emotions">
                            ${Object.entries(emotionCounts).map(([emotionId, users]) => {
                                const emotion = REACTION_OPTIONS.find(r => r.id === emotionId);
                                return emotion ? `
                                    <div class="comment-emotion-item">
                                        <img src="${emotion.image}" alt="${emotion.label}">
                                        <span>${users.length}</span>
                                    </div>
                                ` : '';
                            }).join('')}
                            <button type="button" class="comment-emotion-picker-btn" onclick="openEmojiPicker('${comment.id}')">😊</button>
                        </div>`
                        : `<div class="comment-emotions">
                            <button type="button" class="comment-emotion-picker-btn" onclick="openEmojiPicker('${comment.id}')">😊 Bày tỏ cảm xúc</button>
                        </div>`;

                    const replies = comment.replies || [];
                    const hasReplies = replies.length > 0;
                    const isReplyExpanded = expandedReplies.has(comment.id);
                    
                    const repliesMarkup = hasReplies ? `
                        <div class="reply-section">
                            <button type="button" class="view-replies-btn" onclick="toggleReplies('${comment.id}')">
                                ${isReplyExpanded ? '▼' : '▶'} ${replies.length} trả lời
                            </button>
                        </div>
                        ${isReplyExpanded ? `
                            <div class="replies-container" id="replies-${comment.id}">
                                ${replies.map(reply => {
                                    const replyTimeText = timeAgo(reply.createdAt);
                                    const replyUserName = reply.shortId
                                        ? '#' + escapeHtml(reply.shortId)
                                        : escapeHtml(reply.displayName || 'Người dùng');
                                    const replyText = escapeHtml(reply.text || '');
                                    const replyAvatarContent = reply.photoURL
                                        ? `<img src="${escapeHtml(reply.photoURL)}" alt="${replyUserName}">`
                                        : `<span>${(reply.shortId || reply.displayName || 'U').charAt(0).toUpperCase()}</span>`;
                                    const isReplyOwner = auth.currentUser?.uid === reply.userId;

                                    return `
                                        <div class="reply-item" id="reply-${reply.id}">
                                            <div class="comment-head">
                                                <div class="comment-user-section">
                                                    <div class="comment-user-avatar">${replyAvatarContent}</div>
                                                    <div class="comment-user-info">
                                                        <div class="comment-user-name">${reply.shortId ? '#' + escapeHtml(reply.shortId) : escapeHtml(reply.displayName || 'Người dùng')}</div>
                                                        <div class="comment-time" data-timestamp="${getTimestampValue(reply.createdAt)}">${replyTimeText}</div>
                                                    </div>
                                                </div>
                                                ${isReplyOwner ? `
                                                    <div class="comment-controls">
                                                        <button type="button" class="comment-btn" onclick="deleteReply('${comment.id}', '${reply.id}')">🗑️ Xóa</button>
                                                    </div>
                                                ` : ''}
                                            </div>
                                            <div class="comment-text">${replyText}</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        ` : ''}
                    ` : '';

                    return `
                        <article class="comment-item" id="comment-${comment.id}">
                            <div class="comment-head">
                                <div class="comment-user-section">
                                    <div class="comment-user-avatar">${avatarContent}</div>
                                    <div class="comment-user-info">
                                        <div class="comment-user-name">${userName}</div>
                                        <div class="comment-time" data-timestamp="${getTimestampValue(comment.createdAt)}">${timeText}</div>
                                    </div>
                                </div>
                                ${isOwner ? `
                                    <div class="comment-controls">
                                        <button type="button" class="comment-btn" onclick="deleteComment('${comment.id}')">🗑️ Xóa</button>
                                    </div>
                                ` : ''}
                            </div>
                            ${userText ? `<div class="comment-text">${userText}</div>` : ''}
                            ${imagesMarkup}
                            ${emotionsMarkup}
                            <div class="reply-section">
                                <button type="button" class="reply-btn" onclick="startReply('${comment.id}')">💬 Trả lời</button>
                            </div>
                            ${replyingToCommentId === comment.id ? `
                                <div class="reply-form">
                                    <div class="reply-form-avatar">
                                        ${auth.currentUser?.photoURL 
                                            ? `<img src="${auth.currentUser.photoURL}" alt="You">` 
                                            : `<span>${(auth.currentUser?.displayName || 'U').charAt(0).toUpperCase()}</span>`
                                        }
                                    </div>
                                    <div class="reply-form-input-group">
                                        <input type="text" id="replyInput-${comment.id}" class="reply-input" placeholder="Viết trả lời...">
                                        <button type="button" class="reply-submit-btn" onclick="submitReply('${comment.id}')">Gửi</button>
                                        <button type="button" class="reply-cancel-btn" onclick="cancelReply()">Hủy</button>
                                    </div>
                                </div>
                            ` : ''}
                            ${repliesMarkup}
                        </article>
                    `;
                }).join('');
            } catch (e) {
                console.error('Lỗi tải bình luận:', e);
                commentList.innerHTML = '<div class="comment-empty">Lỗi tải bình luận. Thử lại?</div>';
            }
        }

        async function deleteComment(commentId) {
            if (!confirm('Xóa bình luận này?')) return;

            try {
                await db.collection('movie_comments').doc(commentId).delete();
                await loadComments(currentMovie);
                showToast('✅ Bình luận đã xóa');
            } catch (e) {
                console.error('Lỗi xóa bình luận:', e);
                showToast('⚠️ Không thể xóa bình luận');
            }
        }

        function startReply(commentId) {
            if (!auth.currentUser) {
                showLoginRequired();
                return;
            }
            replyingToCommentId = commentId;
            loadComments(currentMovie);
            setTimeout(() => {
                const input = document.getElementById(`replyInput-${commentId}`);
                if (input) input.focus();
            }, 100);
        }

        function cancelReply() {
            replyingToCommentId = '';
            loadComments(currentMovie);
        }

        async function submitReply(commentId) {
            if (!auth.currentUser) {
                showLoginRequired();
                return;
            }

            const input = document.getElementById(`replyInput-${commentId}`);
            const replyText = input.value.trim();

            if (!replyText) {
                showToast('✍️ Viết trả lời trước khi gửi');
                return;
            }

            input.disabled = true;

            try {
                const docRef = db.collection('movie_comments').doc(commentId);
                const doc = await docRef.get();
                const replies = doc.data().replies || [];
                const shortId = await getShortId(auth.currentUser.uid);

                replies.push({
                    id: Date.now().toString(),
                    text: replyText,
                    displayName: shortId ? '#' + shortId : (auth.currentUser.displayName || auth.currentUser.email?.split('@')[0] || 'Người dùng'),
                    shortId: shortId || '',
                    photoURL: auth.currentUser.photoURL || '',
                    userId: auth.currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await docRef.update({ replies });
                replyingToCommentId = '';
                expandedReplies.add(commentId);
                await loadComments(currentMovie);
                showToast('💬 Trả lời đã gửi!');
            } catch (e) {
                console.error('Lỗi gửi trả lời:', e);
                showToast('⚠️ Lỗi gửi trả lời. Thử lại?');
                input.disabled = false;
            }
        }

        function toggleReplies(commentId) {
            if (expandedReplies.has(commentId)) {
                expandedReplies.delete(commentId);
            } else {
                expandedReplies.add(commentId);
            }
            loadComments(currentMovie);
        }

        async function deleteReply(commentId, replyId) {
            if (!confirm('Xóa trả lời này?')) return;

            try {
                const docRef = db.collection('movie_comments').doc(commentId);
                const doc = await docRef.get();
                let replies = doc.data().replies || [];
                replies = replies.filter(r => r.id !== replyId);

                await docRef.update({ replies });
                await loadComments(currentMovie);
                showToast('✅ Trả lời đã xóa');
            } catch (e) {
                console.error('Lỗi xóa trả lời:', e);
                showToast('⚠️ Không thể xóa trả lời');
            }
        }

        async function toggleCommentEmotion(commentId, emotionId) {
            if (!auth.currentUser) {
                showLoginRequired();
                return;
            }

            try {
                const docRef = db.collection('movie_comments').doc(commentId);
                const doc = await docRef.get();
                const emotions = doc.data().emotions || {};

                if (!emotions[emotionId]) {
                    emotions[emotionId] = [];
                }

                const userIndex = emotions[emotionId].indexOf(auth.currentUser.uid);
                if (userIndex > -1) {
                    emotions[emotionId].splice(userIndex, 1);
                } else {
                    emotions[emotionId].push(auth.currentUser.uid);
                }

                if (emotions[emotionId].length === 0) {
                    delete emotions[emotionId];
                }

                await docRef.update({ emotions });
                await loadComments(currentMovie);
            } catch (e) {
                console.error('Lỗi cập nhật cảm xúc:', e);
            }
        }

        let currentEmojiCommentId = '';

        function openEmojiPicker(commentId) {
            currentEmojiCommentId = commentId;
            const modal = document.getElementById('emojiPickerModal');
            const grid = document.getElementById('emojiGrid');

            grid.innerHTML = REACTION_OPTIONS.map(emotion => `
                <div class="emoji-item" onclick="selectCommentEmoji('${emotion.id}')" title="${emotion.label}">
                    <img src="${emotion.image}" alt="${emotion.label}" style="width: 32px; height: 32px;">
                </div>
            `).join('');

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeEmojiPicker() {
            const modal = document.getElementById('emojiPickerModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            currentEmojiCommentId = '';
        }

        async function selectCommentEmoji(emotionId) {
            if (!currentEmojiCommentId) return;
            await toggleCommentEmotion(currentEmojiCommentId, emotionId);
            closeEmojiPicker();
        }

        function openImageViewer(imageSrc) {
            const viewer = document.createElement('div');
            viewer.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.9);
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                backdrop-filter: blur(5px);
            `;
            viewer.onclick = () => viewer.remove();
            viewer.innerHTML = `
                <img src="${imageSrc}" style="max-width: 90%; max-height: 90%; border-radius: 12px; cursor: pointer;" onclick="event.stopPropagation()">
            `;
            document.body.appendChild(viewer);
        }

        async function submitComment(event) {
            event.preventDefault();

            if (!auth.currentUser) {
                showLoginRequired();
                return;
            }

            const textarea = document.getElementById('commentInput');
            const submitBtn = document.querySelector('.comment-submit');
            const text = textarea.value.trim();

            if (!text && selectedImages.length === 0) {
                showToast('✍️ Viết bình luận hoặc thêm ảnh trước');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '...';

            try {
                const shortId = await getShortId(auth.currentUser.uid);
                const commentData = {
                    movieId: movieId,
                    movieTitle: currentMovie?.title || '',
                    episodeLabel: currentMovie?.episode || currentMovie?.title || 'Tập phim',
                    text: text,
                    reaction: selectedCommentReaction,
                    displayName: shortId ? '#' + shortId : (auth.currentUser.displayName || auth.currentUser.email?.split('@')[0] || 'Người dùng'),
                    shortId: shortId || '',
                    photoURL: auth.currentUser.photoURL || '',
                    userId: auth.currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    images: selectedImages,
                    emotions: {},
                    replies: []
                };

                await db.collection('movie_comments').add(commentData);

                document.getElementById('commentInput').value = '';
                selectedCommentReaction = '';
                selectedImages = [];
                document.getElementById('imagePreviewContainer').innerHTML = '';
                document.getElementById('imageInput').value = '';
                const buttons = document.querySelectorAll('.reaction-btn');
                buttons.forEach((btn) => btn.classList.remove('active'));
                await loadComments(currentMovie);
                showToast('💬 Bình luận đã gửi!');
            } catch (e) {
                console.error('Lỗi gửi bình luận:', e);
                showToast('⚠️ Lỗi gửi bình luận. Thử lại?');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Đăng';
            }
        }

        function showLoginRequired() {
            const overlay = document.getElementById('loginRequiredOverlay');
            if (overlay) {
                overlay.classList.add('show');
                overlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        function closeLoginRequiredPopup() {
            const overlay = document.getElementById('loginRequiredOverlay');
            if (overlay) {
                overlay.classList.remove('show');
                overlay.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
            window.location.href = 'index.html';
        }

        function shareMovie() {
            if (!isLoggedIn || isBanned) {
                showLoginRequired();
                return;
            }

            const url = window.location.href;
            const title = currentMovie?.title || 'Xem phim trên Doraemon Fansub';

            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: `🎬 ${title}\nXem ngay tại:`,
                    url: url
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url)
                    .then(() => {
                        showToast('✅ Đã sao chép link phim!');
                    })
                    .catch(() => {
                        prompt('📤 Sao chép link này để chia sẻ:', url);
                    });
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        let lastAuthUserId = null;
        let authStateInitialized = false;

        async function handleMovieAuthState(user) {
            if (!user && !authReady) {
                return;
            }

            const userId = user?.uid || null;
            if (authStateInitialized && lastAuthUserId === userId) {
                return;
            }

            lastAuthUserId = userId;
            authStateInitialized = true;

            if (user) {
                const twoFactor = await getUserTwoFactorData(user.uid);
                if (twoFactor?.enabled && twoFactor.secret && getTwoFactorVerifiedUid() !== user.uid) {
                    await auth.signOut();
                    window.location.href = 'login.html';
                    return;
                }

                isBanned = await checkBannedUser(user.email);
                if (isBanned) {
                    showLoginRequired();
                    document.getElementById('movieContent').innerHTML = `
                            <div class="login-required-message">
                                <span class="icon">🚫</span>
                                <h2>Tài khoản đã bị khóa</h2>
                                <p>Tài khoản của bạn đã bị khóa. Vui lòng liên hệ admin để được hỗ trợ.</p>
                            </div>
                        `;
                    return;
                }

                isLoggedIn = true;
                await loadMovieDetail();
            } else {
                isLoggedIn = false;
                isBanned = false;
                showLoginRequired();
                document.getElementById('movieContent').innerHTML = `
                        <div class="login-required-message">
                            <span class="icon">🔒</span>
                            <h2>Vui lòng đăng nhập</h2>
                            <p>Bạn cần đăng nhập để xem phim này.</p>
                        </div>
                    `;
            }
        }

        auth.onAuthStateChanged((user) => {
            authReady = true;
            handleMovieAuthState(user);
        });

        (async function initializeMovieAuth() {
            const initialUser = await waitForAuthUser();
            await handleMovieAuthState(initialUser);
        })();

        document.addEventListener('click', function(e) {
            const overlay = document.getElementById('loginRequiredOverlay');
            if (overlay && overlay.classList.contains('show')) {
                if (e.target === overlay) {
                    closeLoginRequiredPopup();
                }
            }

            const emojiModal = document.getElementById('emojiPickerModal');
            if (emojiModal && emojiModal.classList.contains('active')) {
                if (e.target === emojiModal) {
                    closeEmojiPicker();
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLoginRequiredPopup();
                closeEmojiPicker();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isLoggedIn && !isBanned) {
                window.location.href = 'index.html';
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                shareMovie();
            }
        });

        console.log('🎬 Trang chi tiết phim đã sẵn sàng!');
        console.log('📤 Nhấn Ctrl+S để chia sẻ phim');
        console.log('⌨️ Nhấn ESC để quay lại');
        console.log('🔒 Kiểm tra đăng nhập trước khi xem phim');
        console.log('🚫 Kiểm tra tài khoản bị cấm');
        console.log('🔗 Đường dẫn đã sửa cho GitHub Pages!');
    </script>
</body>
</html>
